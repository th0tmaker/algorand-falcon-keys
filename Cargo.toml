[package]
name = "algorand-falcon-keys"
version = "0.1.0"
edition = "2024"
build = "build.rs"
authors = ["th0tmaker"]
description = "Rust bindings for deterministic Falcon-1024 post-quantum key generation, signing, and verification"
license = "MIT"
repository = "https://github.com/th0tmaker/algorand-falcon-keys"

[dependencies]
zeroize = { version = "1", default-features = false }
hkdf = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true, features = ["zeroize"] }
unicode-normalization = { version = "0.1", optional = true }

[features]
mnemonic = ["dep:hkdf", "dep:pbkdf2", "dep:sha2", "dep:unicode-normalization", "zeroize/alloc"]

[build-dependencies]
cc = "1.0"




